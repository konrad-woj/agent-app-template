# Research-question dataset — 5 single-turn questions for the research assistant.
#
# Topics are well documented, so the ReAct loop can find sources and the judge
# can check accuracy. q_005 is deliberately contested and exercises the
# rubric's uncertainty_handling criterion.
#
# Fields:
#   input.messages        — conversation turns sent to POST /v1/chat
#   input.approve_plan    — whether the simulated human approves the research plan
#   expected_output       — evals.models.ExpectedOutput
#     must_cover          — key points a complete answer covers; the quality judge's reference
#     must_include_terms  — terms that must appear in final_answer (case-insensitive substring)
#     must_not_contain    — refusal / placeholder phrases that must not appear
#     scoring_hints       — extra guidance for the quality judge

dataset_name: sample
items:
  - id: q_001
    name: 2008 financial crisis
    input:
      messages:
        - role: user
          content: What caused the 2008 financial crisis?
      approve_plan: true
    expected_output:
      must_cover:
        - id: kp1
          description: A US housing bubble fuelled by subprime mortgage lending and loose underwriting
        - id: kp2
          description: Securitisation (mortgage-backed securities, CDOs) spread mortgage risk across the financial system, helped by overly generous credit ratings
        - id: kp3
          description: Banks and investment banks were highly leveraged and relied on short-term funding
        - id: kp4
          description: The collapse of Lehman Brothers in September 2008 turned the downturn into a global panic
      must_include_terms:
        - subprime
        - Lehman
      must_not_contain:
        - "I cannot help with"
        - "as an AI"
      scoring_hints:
        - Should explain how losses on housing spread through securitised products, not just list causes.
        - Regulatory gaps (e.g. shadow banking, credit default swaps) are a plus but not required.

  - id: q_002
    name: mRNA vaccines
    input:
      messages:
        - role: user
          content: How do mRNA vaccines work?
      approve_plan: true
    expected_output:
      must_cover:
        - id: kp1
          description: The vaccine delivers mRNA that encodes a viral antigen, such as the SARS-CoV-2 spike protein
        - id: kp2
          description: The mRNA is packaged in lipid nanoparticles that carry it into cells
        - id: kp3
          description: Cells translate the mRNA into the antigen, which triggers antibody and T-cell responses
        - id: kp4
          description: The mRNA does not enter the cell nucleus or alter DNA, and is broken down within days
      must_include_terms:
        - lipid nanoparticle
        - spike protein
      must_not_contain:
        - "I cannot help with"
        - "as an AI"
      scoring_hints:
        - Should not claim mRNA vaccines change the recipient's DNA; that is a factual error.
        - Mentioning nucleoside modification (e.g. pseudouridine) is a plus.

  - id: q_003
    name: CRISPR-Cas9
    input:
      messages:
        - role: user
          content: What is CRISPR-Cas9 and how is it used in gene editing?
      approve_plan: true
    expected_output:
      must_cover:
        - id: kp1
          description: CRISPR-Cas9 is adapted from a bacterial immune defence against viruses
        - id: kp2
          description: A guide RNA directs the Cas9 enzyme to a matching DNA sequence, where Cas9 cuts both strands
        - id: kp3
          description: The cell repairs the cut by non-homologous end joining (disrupting a gene) or homology-directed repair (inserting a template)
        - id: kp4
          description: Uses include research, agriculture and therapies, with risks such as off-target edits
      must_include_terms:
        - guide RNA
        - Cas9
      must_not_contain:
        - "I cannot help with"
        - "as an AI"
      scoring_hints:
        - Doudna and Charpentier (Nobel Prize in Chemistry 2020) are a plus, not required.
        - An approved therapy (e.g. Casgevy for sickle cell disease) is a strong concrete example.

  - id: q_004
    name: Drivers of global warming
    input:
      messages:
        - role: user
          content: What are the main drivers of current global warming?
      approve_plan: true
    expected_output:
      must_cover:
        - id: kp1
          description: Greenhouse gas emissions from human activity, chiefly carbon dioxide from burning fossil fuels
        - id: kp2
          description: Methane (agriculture, fossil fuel production, landfills) and nitrous oxide add substantial warming
        - id: kp3
          description: Deforestation and land-use change release carbon and reduce carbon sinks
        - id: kp4
          description: The IPCC assesses human influence as the dominant cause of warming since the mid-20th century
      must_include_terms:
        - carbon dioxide
        - greenhouse
      must_not_contain:
        - "I cannot help with"
        - "as an AI"
      scoring_hints:
        - Natural factors (solar, volcanic) may be mentioned but must not be presented as the main driver.
        - Feedbacks (water vapour, ice-albedo) amplifying the warming are a plus.

  - id: q_005
    name: Fall of the Western Roman Empire
    input:
      messages:
        - role: user
          content: Why did the Western Roman Empire fall?
      approve_plan: true
    expected_output:
      must_cover:
        - id: kp1
          description: Historians attribute the fall to several interacting causes and still debate their relative weight
        - id: kp2
          description: Pressure from migrating and invading groups such as the Goths, Vandals and Huns
        - id: kp3
          description: Political instability, civil wars and weakening central authority
        - id: kp4
          description: Fiscal and economic strain, including the loss of tax-rich provinces such as North Africa
        - id: kp5
          description: The conventional end date is 476 CE, when Odoacer deposed Romulus Augustulus
      must_include_terms:
        - "476"
      must_not_contain:
        - "I cannot help with"
        - "as an AI"
      scoring_hints:
        - This topic is contested; an answer that gives one cause as settled fact should score low on uncertainty_handling.
        - Naming competing schools (e.g. "decline and fall" vs. "transformation" views) is a plus.
