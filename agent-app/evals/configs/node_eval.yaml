# Node-level eval config — Phases 5a/5e (see PLAN.md and evals/node_eval.py).
#
# Usage:
#   uv run python evals/run.py node_eval
#   uv run task node-eval
#
# Runs each node task in evals/node_tasks.py over its dataset against a real LLM
# and checks every item's expected_output. No app server, Postgres or MCP server
# needed — only the LLM backend. GLiGuard is mocked permissively (see
# evals/node_tasks.py). To evaluate a subset, copy this file and trim `nodes`.

type: node_eval
nodes:
  - node: planner
    dataset: node/planner.yaml
  - node: writer
    dataset: node/writer.yaml
  - node: verifier
    dataset: node/verifier.yaml
  - node: output_guard
    dataset: node/output_guard.yaml
  - node: input_guard
    dataset: node/input_guard.yaml
  - node: resume_guard
    dataset: node/resume_guard.yaml

# LiteLLM model id to evaluate; null → AGENT_LLM_MODEL (the app's own default).
deployment: null
