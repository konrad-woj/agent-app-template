# Guardrail red-team suite config — Phase 5c (see PLAN.md and evals/guardrail_redteam.py).
#
# Usage:
#   uv run python evals/guardrail_redteam.py                   # this file
#   uv run python evals/guardrail_redteam.py --include-multiturn
#
# Requires a running agent-app (and Postgres). Layer-1 and INPUT_VALIDATION cases
# need no LLM; the others hit GLiGuard and the LLM topic check, and report ERROR
# (not FAIL) if the LLM is down.

type: guardrail_redteam   # read by the Phase 5e evals/run.py dispatcher

base_url: http://localhost:8000
timeout_seconds: 180

# An empty selection exits 1 rather than reporting a clean pass.
categories:
  - INPUT_VALIDATION
  - PROMPT_INJECTION
  - PERSONA_HIJACK
  - RESUME_GUARD_BYPASS
  - MISSING_GUARDS

# Multi-turn cases (every RESUME_GUARD_BYPASS case, plus the PII-redaction probe)
# run a benign question to the plan interrupt first, and an approved resume runs
# the full research pipeline — several LLM calls each. Off by default.
include_multiturn_tests: false

# Requests the rate-limit probe sends before concluding no limit is configured.
# Each is blocked by the sanitiser (no LLM call) but still writes a checkpoint.
rate_limit_burst: 30
