# Scoring rubric for the research assistant's final answers.
#
# TWO evaluation layers:
#
#   quality_criteria   — LLM-judge scores, consumed by evals/evaluators.py's
#                        quality_score_evaluator. The judge returns an
#                        evals.models.QualityVerdict: per criterion, reasoning →
#                        score → confidence → one-line reason. Criterion ids and
#                        max_score values here MUST match QualityVerdict's fields
#                        and scales (checked at load time by
#                        evals.evaluators.check_rubric_matches_verdict).
#                        The judge also sees each dataset item's must_cover key
#                        points and scoring_hints as its reference.
#                        Deliberately different from the Reflection critic's
#                        criteria (app/graph/nodes/subgraphs/reflection.py), so
#                        the eval doesn't grade with the rubric the agent already
#                        optimised against.
#                        An answer passes when total >= minimum_total AND every
#                        per-criterion minimum is met — computed in code from the
#                        scores, never taken from the judge.
#
#   trace_assertions   — Deterministic checks on the graph execution trace
#                        (checkpoint history + final state).  These never call an
#                        LLM.  Failures indicate a wiring or logic bug, not a
#                        quality problem.  Organised per-node so each node can be
#                        tested in isolation with a fake upstream state.
#
# Both layers are consumed by evals/run_experiment.py and by the unit tests in
# tests/evals/test_evaluators.py and tests/evals/test_trace_assertions.py.

# ---------------------------------------------------------------------------
# Layer 1 — LLM quality criteria
# ---------------------------------------------------------------------------
#
# Why 0–4 for some criteria and 0–2 for others (PLAN.md Phase 5b): use 0–4 when
# the evidence is enumerable — you can point at sentences and count them
# (key_point_coverage, factual_accuracy, specificity). Use 0–2 when the criterion
# is inherently holistic (focus, uncertainty_handling). Coarse-but-not-binary
# scales give LLM judges the best agreement with humans; don't widen them.
# Changing a max_score here also means changing evals/models.py:QualityVerdict.

quality_criteria:

  - id: key_point_coverage
    name: Key Point Coverage
    description: >
      The answer covers the key points listed in the reference for this question.
      A point counts only when the answer states it (or an equivalent), not when
      it merely mentions a related keyword.
    max_score: 4
    scoring_guide:
      0: None of the reference key points are covered.
      1: About a quarter of the key points are covered.
      2: About half of the key points are covered.
      3: Most key points are covered; one is missing or only gestured at.
      4: Every key point is covered explicitly.
    per_criterion_minimum: 3

  - id: factual_accuracy
    name: Factual Accuracy
    description: >
      The answer's factual claims (names, dates, figures, causal statements) are
      correct — consistent with the reference key points and with well-established
      knowledge. Count the claims that are wrong or misleading.
    max_score: 4
    scoring_guide:
      0: The central claims are wrong.
      1: Several significant errors; the answer would mislead a reader.
      2: One significant error, or several minor ones.
      3: Only a minor slip (e.g. an imprecise date or figure); nothing misleading.
      4: No factual errors found.
    per_criterion_minimum: 3

  - id: specificity
    name: Specificity
    description: >
      The answer uses concrete names, dates, figures, and mechanisms rather than
      generic statements ("many factors contributed", "experts agree").
    max_score: 4
    scoring_guide:
      0: Entirely generic; could answer almost any question on the topic.
      1: One or two concrete details; the rest is vague.
      2: About half of the statements are backed by concrete detail.
      3: Most statements are concrete; a few remain generic.
      4: Every substantive statement is concrete and precise.
    per_criterion_minimum: 2

  - id: focus
    name: Focus
    description: >
      The answer addresses the question that was asked, without padding,
      off-topic digressions, or restating the question at length.
    max_score: 2
    scoring_guide:
      0: Mostly answers a different question or is dominated by filler.
      1: Answers the question but with noticeable drift or padding.
      2: Directly answers the question throughout.
    per_criterion_minimum: 1

  - id: uncertainty_handling
    name: Uncertainty Handling
    description: >
      Where the topic is contested or the evidence is limited, the answer says so
      and presents the competing views; it does not present a disputed claim as
      settled. On a settled topic, stating established facts plainly scores 2.
    max_score: 2
    scoring_guide:
      0: Presents contested or uncertain claims as settled fact.
      1: Hints at uncertainty but doesn't say what is contested or why.
      2: Calibrated — contested points and limits of the evidence are named where they exist.
    per_criterion_minimum: 1

pass_policy:
  # Answer accepted when total score AND all per-criterion minimums are met.
  minimum_total: 12          # out of 16 maximum (4+4+4+2+2)
  # Per-criterion minimums are declared inline above (per_criterion_minimum field).

  # The judge LLM outputs an evals.models.QualityVerdict:
  #   { "<criterion_id>": { "reasoning": str, "score": int, "confidence": "high"|"low",
  #                         "reason": str }, …,
  #     "summary": str }
  # It is not asked for a total or a pass/fail; evals/evaluators.py:score_verdict
  # derives both from the scores and this pass_policy. Criteria marked
  # confidence="low" are reported for human review in the evaluator's comment.

# ---------------------------------------------------------------------------
# Layer 2 — Deterministic trace assertions
# ---------------------------------------------------------------------------
#
# Each assertion is evaluated against the LangGraph checkpoint history and/or
# final AgentState without calling an LLM. Node names and state fields match
# app/graph/workflow.py and app/graph/state.py. `state_field` checks read the
# FINAL state, so they can only assert what holds at the end of a run.
#
# Fields:
#   id           — unique assertion ID (used in test reports)
#   node         — which node this assertion targets ("flow" = end-to-end)
#   description  — human-readable explanation
#   check        — what to inspect:
#                    state_field   — read a key from the final AgentState
#                    checkpoint    — inspect the checkpoint history list
#                    messages      — inspect the messages list in the final AgentState
#   condition    — the assertion predicate (see evals/trace_assertions.py for evaluation)
#   expected     — expected value (for equality / membership checks)
#   negative_case — if true, this assertion only applies to negative-path runs
#                   (e.g. approve_plan: false, or an off-topic/harmful-output probe).
#                   evals/datasets/sample.yaml has no negative-case items today —
#                   adversarial probes are the Phase 5c guardrail_redteam suite's job.
#                   evals/trace_assertions.py evaluates negative_case assertions only
#                   when explicitly asked to (include_negative_cases=True).

trace_assertions:

  # --- input_guard ---

  - id: ta_input_guard_blocks_off_topic
    node: input_guard
    description: >
      When the user message is off-topic (not a research question),
      input_guard must set status="blocked" and guard_reason must be non-empty.
    check: state_field
    fields: [status, guard_reason]
    condition: equals
    expected:
      status: blocked
      guard_reason: non_empty
    negative_case: true   # only tested on the off-topic probe case

  - id: ta_input_guard_passes_valid
    node: input_guard
    description: >
      When the user message is a valid research query, input_guard must NOT
      set status="blocked"; the graph must continue to planner.
    check: checkpoint
    condition: node_executed
    expected: planner

  # --- planner / plan_review ---

  - id: ta_plan_review_emits_interrupt
    node: plan_review
    description: >
      The run must pause for human approval at plan_review, the only node that
      calls interrupt(). Some checkpoint's next must be exactly ("plan_review",).
    check: checkpoint
    condition: graph_interrupted_at
    expected: plan_review

  - id: ta_planner_plan_non_empty
    node: planner
    description: >
      After the planner runs, the "plan" state field must be a non-empty list.
    check: state_field
    fields: [plan]
    condition: non_empty_list

  - id: ta_planner_aborts_on_reject
    node: plan_review
    description: >
      When the human resumes with approve=false, status must be set to "aborted"
      and the graph must not proceed to resume_guard / react_researcher.
    check: state_field
    fields: [status]
    condition: equals
    expected:
      status: aborted
    negative_case: true

  # --- resume_guard ---

  - id: ta_resume_guard_passes_valid
    node: resume_guard
    description: >
      On the happy path (approve=true, clean resume message), the graph must
      continue past resume_guard to react_researcher.
    check: checkpoint
    condition: node_executed
    expected: react_researcher

  # --- react_researcher (ReAct) ---

  - id: ta_react_calls_at_least_one_tool
    node: react_researcher
    description: >
      The react_researcher must call at least one MCP tool before exiting.
      Verified by checking that react_steps >= 1 in final state.
    check: state_field
    fields: [react_steps]
    condition: gte
    expected: 1

  - id: ta_react_tool_messages_present
    node: react_researcher
    description: >
      At least one ToolMessage must appear in the messages list after
      react_researcher completes, confirming a tool was actually invoked.
    check: messages
    condition: contains_message_type
    expected: tool

  - id: ta_react_exits_without_tool_calls
    node: react_researcher
    description: >
      The final message produced by react_researcher must have no tool_calls,
      confirming the loop exited cleanly via _react_condition.
    check: messages
    condition: last_ai_message_has_no_tool_calls

  # --- writer ---

  - id: ta_writer_produces_draft
    node: writer
    description: >
      After writer runs, draft_answer must be a non-empty string of at least
      100 characters (rules out placeholder outputs).
    check: state_field
    fields: [draft_answer]
    condition: min_length
    expected: 100

  # --- reflection_subgraph ---

  - id: ta_reflection_ran_at_least_once
    node: reflection_subgraph
    description: >
      reflection_attempts must be >= 1 in the final state, confirming the
      critic executed at least one evaluation pass.
    check: state_field
    fields: [reflection_attempts]
    condition: gte
    expected: 1

  - id: ta_reflection_final_answer_set
    node: reflection_subgraph
    description: >
      After reflection_subgraph completes with passed=true, final_answer must
      be non-empty.
    check: state_field
    fields: [reflection_passed, final_answer]
    condition: when_field_true_then_non_empty
    expected:
      flag_field: reflection_passed
      non_empty_field: final_answer

  # --- output_guard ---

  - id: ta_output_guard_blocks_harmful
    node: output_guard
    description: >
      When the final_answer contains content the output guard should block
      (tested via a seeded harmful-output fixture), status must be "blocked".
    check: state_field
    fields: [status]
    condition: equals
    expected:
      status: blocked
    negative_case: true

  - id: ta_output_guard_passes_clean
    node: output_guard
    description: >
      For all standard dataset entries, the output guard must pass the answer
      (status="done") after reflection has already refined it.
    check: state_field
    fields: [status]
    condition: equals
    expected:
      status: done

  # --- end-to-end flow ---

  - id: ta_flow_status_done
    node: flow
    description: >
      A full happy-path run must end with status="done" and a non-empty
      final_answer.
    check: state_field
    fields: [status, final_answer]
    condition: equals
    expected:
      status: done
      final_answer: non_empty

  - id: ta_flow_all_nodes_executed
    node: flow
    description: >
      Checkpoint history must contain at least one entry for each main node:
      input_guard, planner, plan_review, resume_guard, react_researcher, writer,
      verify_subgraph, reflection_subgraph, output_guard.
    check: checkpoint
    condition: all_nodes_executed
    expected:
      - input_guard
      - planner
      - plan_review
      - resume_guard
      - react_researcher
      - writer
      - verify_subgraph
      - reflection_subgraph
      - output_guard

  - id: ta_flow_guard_reason_empty_on_success
    node: flow
    description: >
      On a successful run, guard_reason must be null — no guardrail was
      triggered.
    check: state_field
    fields: [guard_reason]
    condition: equals
    expected:
      guard_reason: null
